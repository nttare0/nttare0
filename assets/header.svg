<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="280" viewBox="0 0 1100 280" role="img" aria-label="Ntare Shema Prince">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.5" stop-color="#111a33"/>
      <stop offset="1" stop-color="#0b1020"/>
    </linearGradient>

    <!-- Animated accent blobs -->
    <radialGradient id="blob1" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blob2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f59e0b" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>

    <!-- Name gradient with shifting accent -->
    <linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e2e8f0"/>
      <stop offset="0.45" stop-color="#7dd3fc">
        <animate attributeName="stop-color" values="#7dd3fc;#f0abfc;#7dd3fc" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="0.7" stop-color="#f0abfc">
        <animate attributeName="stop-color" values="#f0abfc;#fbbf24;#f0abfc" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#fbbf24"/>
    </linearGradient>

    <linearGradient id="lineGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#a78bfa">
        <animate attributeName="stop-color" values="#a78bfa;#22d3ee;#a78bfa" dur="5s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>

    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .blob-a { animation: driftA 12s ease-in-out infinite; }
    .blob-b { animation: driftB 16s ease-in-out infinite; }
    .spark  { animation: twinkle 2.6s ease-in-out infinite; }
    .star   { animation: twinkle 3.4s ease-in-out infinite; }
    @keyframes driftA {
      0%   { transform: translate(0,0) scale(1); }
      50%  { transform: translate(140px,40px) scale(1.15); }
      100% { transform: translate(0,0) scale(1); }
    }
    @keyframes driftB {
      0%   { transform: translate(0,0) scale(1); }
      50%  { transform: translate(-160px,-30px) scale(1.2); }
      100% { transform: translate(0,0) scale(1); }
    }
    @keyframes twinkle {
      0%,100% { opacity: 0.15; }
      50%     { opacity: 0.9; }
    }
    .name { animation: fadeUp 2.2s ease both; }
    .sub  { animation: fadeUp 2.2s ease 0.4s both; }
    .stripe { animation: grow 2.2s ease 0.7s both; }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(18px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes grow {
      from { transform: scaleX(0); }
      to   { transform: scaleX(1); }
    }
  </style>

  <rect width="1100" height="280" fill="url(#bg)"/>

  <!-- drifting blobs -->
  <circle class="blob-a" cx="180" cy="150" r="170" fill="url(#blob1)"/>
  <circle class="blob-b" cx="900" cy="120" r="190" fill="url(#blob2)"/>

  <!-- decorative stars / sparkles -->
  <g fill="#7dd3fc">
    <circle class="spark" cx="120" cy="60" r="2.2"/>
    <circle class="star"  cx="300" cy="220" r="2"/>
    <circle class="star"  cx="820" cy="50" r="2.2"/>
    <circle class="spark" cx="980" cy="200" r="2"/>
    <circle class="star"  cx="640" cy="230" r="1.8"/>
  </g>

  <!-- badge: Rwanda -->
  <g font-family="'Segoe UI',Verdana,sans-serif">
    <rect x="446" y="46" width="208" height="34" rx="17" fill="#0f172a" stroke="url(#lineGrad)" stroke-width="1.4"/>
    <text x="550" y="69" text-anchor="middle" font-size="16" font-weight="600" fill="#94a3b8" letter-spacing="1">📍 Rwanda · Open to work</text>
  </g>

  <!-- Name -->
  <text class="name" x="550" y="150" text-anchor="middle" font-family="'Segoe UI',Verdana,sans-serif" font-size="66" font-weight="800" fill="url(#nameGrad)" filter="url(#glow)" letter-spacing="2">Ntare Shema Prince</text>

  <!-- animated underline stripe -->
  <rect class="stripe" x="350" y="170" width="400" height="4" rx="2" fill="url(#lineGrad)" transform-origin="550 172"/>

  <!-- subtitle -->
  <text class="sub" x="550" y="216" text-anchor="middle" font-family="'Segoe UI',Verdana,sans-serif" font-size="22" font-weight="500" fill="#cbd5e1" letter-spacing="3">FULL-STACK DEVELOPER &#160;&#183;&#160; CLOUD &amp; AI ENTHUSIAST</text>
</svg>
